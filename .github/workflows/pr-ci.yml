name: pr-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Node floor (engines >=20) + the version version-drift/publish already run on.
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # Hermetic black-box gate on the BUILT bundle: characterization coverage + parity
      # vs the frozen 0.4.9 baseline + the MCP stdio protocol smoke. Zero egress.
      - name: Integration (characterization + MCP e2e)
        run: npm run test:integration
